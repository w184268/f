# WatchTube 配置文件 —— 复制为 config.yaml 后按需修改
# 所有值都可以用环境变量覆盖，规则：WT_<大写键名>，例如 WT_LLM__API_KEY=sk-xxx

server:
  host: 0.0.0.0
  port: 8787
  # 手机端实际能访问到的地址。务必填写，否则手机拿到的视频链接不可用
  #   局域网： http://192.168.1.10:8787
  #   穿透：   https://your-name.trycloudflare.com
  public_base_url: "http://192.168.1.10:8787"
  # 手机端调 API 时携带的密钥（HTTP 头 X-Api-Key）
  bridge_key: "change-me-please"

# 手表回传设置
delivery:
  # video：回传视频（推荐，需手表支持微聊视频）
  # audio：把视频内容讲成语音发送（兼容性最好）
  # text ：只回一段文字摘要 + 链接（兼容所有型号）
  # auto ：优先 video，失败自动降级到 audio
  reply_mode: video
  # 每个孩子每天最多自动回传多少条，防止被刷屏 / 流量爆炸
  daily_quota: 20
  # 同一内容在多长时间内不重复下发（秒）
  dedupe_window: 3600

# 大模型：把孩子的话变成准确搜索词
understanding:
  enabled: true
  # 任何 OpenAI 兼容接口均可：DeepSeek / 通义 / OpenAI / 本地 Ollama
  base_url: "https://api.deepseek.com/v1"
  api_key: ""
  model: "deepseek-chat"
  temperature: 0.3
  timeout: 25
  # 调用失败时是否自动降级到本地规则引擎
  fallback_to_rules: true
  # 给孩子回复的口吻
  reply_persona: "一位耐心的家长"

# 视频检索
search:
  provider: bilibili
  max_candidates: 12
  # 偏好的片长区间（秒）。太短的没内容，太长的孩子看不完且文件大
  prefer_duration: [20, 900]
  # 儿童友好白名单词：命中则加分
  child_friendly_hints:
    - 儿童
    - 少儿
    - 启蒙
    - 小朋友
    - 幼儿园
    - 小学
    - 动画
    - 科普
    - 十万个为什么
    - 亲子
    - 绘本
    - 儿歌
    - 手工
    - 实验
    - 纪录片
  # 成人向黑名单词：命中直接否决
  blocked_keywords:
    - 成人
    - 福利
    - 赌博
    - 恐怖
    - 血腥
    - 暴力
    - 色情
    - 惊悚
    - 社会摇
    - 擦边
    - 鬼故事
    - 灵异
    - 抽烟
    - 喝酒
    - 追剧
    - 解说全集
    - 午夜
  # 优先的 UP 主 / 分区名（打分加权，命中加分），留空表示不限制
  prefer_authors: []
  prefer_typenames:
    - 科普
    - 动物圈
    - 儿童教育
    - 学前教育
    - 亲子
    - 纪录片
    - 手工
    - 绘画
    - 校园学习
  # 标题与提问的最低相关度（0~1）。低于此值直接否决，避免"海水为什么咸"
  # 搜出《火锅海带为什么要打结》这类只共享虚词的结果。调到 0 表示不校验
  min_relevance: 0.15
  # 只看高于某个播放量的结果，过滤营销号低质内容
  min_play: 3000

# 视频产出规格（按手表能力压制约）
video:
  max_duration: 60        # 最长保留秒数（60s @380kbps ≈ 2.8MB）
  width: 320              # 输出宽度
  height: 320             # 输出高度（手表屏幕接近方形，这里保持稳定画布，
                          # 原片无论横竖都会等比缩放 + 黑边补齐，不会变形）
  fps: 24
  video_bitrate: "380k"
  audio_bitrate: "48k"
  audio_sample_rate: 22050
  mono_audio: true
  max_size_mb: 8          # 超过则自动降码率重压
  keep_source: false      # 是否保留原始下载文件
  ffmpeg_bin: "ffmpeg"
  ffprobe_bin: "ffprobe"

# 家长审核（当前：已关闭，全自动下发）
moderation:
  # auto  ：全自动，通过安全过滤后直接下发给孩子
  # review：视频先停在家长看板，家长点"同意下发"后手机才取走
  mode: auto
  # 命中这些词时强制转人工审核（即使 mode 为 auto）。
  # 当前留空 = 完全不再拦任何人：想恢复这道兜底就把词填回来，例如
  #   - 死亡
  #   - 打仗
  #   - 自杀
  always_review_keywords: []

# 说明：关闭的是"需要家长点批准"这一步。以下自动安全过滤依然全程生效，
# 它们不需要人工介入，也不会阻塞下发：
#   · search.blocked_keywords —— 成人/恐怖/擦边等内容一票否决
#   · search.min_relevance     —— 标题与提问不相关的结果直接丢弃
#   · search.min_play          —— 过滤低质营销号
#   · delivery.daily_quota     —— 每日下发条数上限
#   · delivery.dedupe_window   —— 短时间内同一句话不重复触发

storage:
  db_path: "data/watchtube.db"
  media_dir: "data/media"

# 语音回退通道：给不支持视频的旧型号（如 Y01）时用到
tts:
  provider: edge        # edge | none（edge 需要 pip install edge-tts，无需 Key）
  voice: zh-CN-XiaoxiaoNeural

# 可选：给家长手机推通知（Bark / Server酱）
notify:
  enabled: false
  bark_url: ""      # 例如 https://api.day.app/xxxxxx
  serverchan_key: ""
