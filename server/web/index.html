<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WatchTube · 家长看板</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --line:#252a33; --txt:#e6e9ef; --sub:#8b93a3;
    --ok:#3ecf8e; --warn:#f5b844; --bad:#ff6b6b; --acc:#5b8cff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  header{position:sticky;top:0;z-index:9;background:rgba(15,17,21,.92);
         backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 20px}
  h1{margin:0;font-size:17px;font-weight:600}
  .meta{color:var(--sub);font-size:12px;margin-top:4px}
  main{max-width:920px;margin:0 auto;padding:18px 20px 60px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;
        padding:10px 14px;min-width:96px}
  .stat b{display:block;font-size:20px;line-height:1.2}
  .stat span{color:var(--sub);font-size:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:14px;margin-bottom:12px}
  .row{display:flex;gap:12px;align-items:flex-start}
  .thumb{width:112px;height:63px;border-radius:8px;object-fit:cover;
         background:#0b0d11;flex:none;border:1px solid var(--line)}
  .grow{flex:1;min-width:0}
  .say{font-size:15px;margin:0 0 6px;word-break:break-word}
  .q{color:var(--acc)}
  .small{color:var(--sub);font-size:12px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);
       color:var(--sub)}
  .tag.s-ok{color:var(--ok);border-color:#1d3c30;background:#12241c}
  .tag.s-bad{color:var(--bad);border-color:#40222a;background:#251318}
  .tag.s-run{color:var(--warn);border-color:#453714;background:#241d10}
  .tag.s-rv{color:var(--acc);border-color:#1f2f56;background:#141c30}
  video{width:100%;max-height:220px;border-radius:8px;background:#000;margin-top:10px}
  button{background:#222733;color:var(--txt);border:1px solid var(--line);
         border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer}
  button:hover{border-color:var(--acc)}
  button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
  .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .err{color:var(--bad);font-size:12px;margin-top:6px}
  .ev{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;
      font-size:12px;color:var(--sub);max-height:150px;overflow:auto}
  .ev div{padding:1px 0}
  .empty{text-align:center;color:var(--sub);padding:50px 0}
  a{color:var(--acc);text-decoration:none}
</style>
</head>
<body>
<header>
  <h1>WatchTube · 家长看板</h1>
  <div class="meta" id="meta">加载中…</div>
</header>
<main>
  <div class="bar" id="stats"></div>
  <div id="list"></div>
</main>

<script>
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const time = t => t ? new Date(t*1000).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
const size = b => b ? (b/1048576).toFixed(2)+'MB' : '';

function cls(s){
  if(['delivered'].includes(s)) return 's-ok';
  if(['failed','rejected'].includes(s)) return 's-bad';
  if(['review_pending'].includes(s)) return 's-rv';
  if(['ready','delivering'].includes(s)) return 's-ok';
  return 's-run';
}
const labels = {received:'已收到',understood:'已理解',no_need:'非提问',searching:'检索中',
  downloading:'下载中',transcoding:'压制中',review_pending:'待审核',ready:'待下发',
  delivering:'下发中',delivered:'已送达',failed:'失败',rejected:'已拒绝'};

async function act(id, path, after){
  try{
    await fetch(`/api/v1/tasks/${id}/${path}`, {method:'POST'});
  }catch(e){ alert('操作失败：'+e); }
  after && after();
  load();
}

function card(it){
  const el = document.createElement('div');
  el.className = 'card';
  let media = '';
  if(it.video_url){
    media = `<video controls preload="metadata" src="${esc(it.video_url)}"></video>`;
  } else if(it.state==='review_pending' && it.cover_url){
    media = `<img class="thumb" style="width:100%;height:120px;margin-top:8px" src="${esc(it.cover_url)}" alt="">`;
  }
  const acts = [];
  if(it.state==='review_pending') acts.push(`<button class="pri" onclick='act(${it.id},"approve")'>同意下发</button>`);
  if(it.state==='review_pending') acts.push(`<button onclick='act(${it.id},"reject")'>这条不行</button>`);
  if(['failed','rejected'].includes(it.state)) acts.push(`<button onclick='act(${it.id},"retry")'>重试</button>`);
  acts.push(`<button onclick='ev(${it.id},this)'>日志</button>`);
  if(it.source_url) acts.push(`<a href="${esc(it.source_url)}" target="_blank"><button>原始出处</button></a>`);

  el.innerHTML = `
    <div class="row">
      ${it.thumb ? `<img class="thumb" src="${esc(it.thumb)}" alt="">` : ''}
      <div class="grow">
        <p class="say">🗣 ${esc(it.raw_text)}</p>
        ${it.query ? `<div class="small">→ 搜索词 <span class="q">${esc(it.query)}</span></div>` : ''}
        <div class="small">${esc(it.reply_text||'')}</div>
        <div class="tags">
          <span class="tag ${cls(it.state)}">${labels[it.state]||it.state}</span>
          ${it.source_title?`<span class="tag">《${esc(it.source_title)}》</span>`:''}
          ${it.source_author?`<span class="tag">UP ${esc(it.source_author)}</span>`:''}
          ${it.source_duration?`<span class="tag">${Math.floor(it.source_duration/60)}分${it.source_duration%60}秒</span>`:''}
          ${it.video_bytes?`<span class="tag">成片 ${size(it.video_bytes)}</span>`:''}
          <span class="tag">${time(it.created_at)}</span>
        </div>
      </div>
    </div>
    ${media}
    ${it.error?`<div class="err">⚠ ${esc(it.error)}</div>`:''}
    ${it.note?`<div class="small" style="margin-top:6px">${esc(it.note)}</div>`:''}
    <div class="acts">${acts.join('')}</div>
    <div class="ev" style="display:none"></div>`;
  return el;
}

async function ev(id, btn){
  const box = btn.closest('.card').querySelector('.ev');
  if(box.style.display !== 'none'){ box.style.display='none'; return; }
  const r = await fetch(`/api/v1/tasks/${id}/events`).then(r=>r.json());
  box.style.display = 'block';
  box.innerHTML = r.events.length
    ? r.events.map(e=>`<div><b>${time(e.ts)}</b> [${e.level}] ${esc(e.message)}</div>`).join('')
    : '<div>暂无日志</div>';
}

async function load(){
  try{
    const d = await fetch('/api/v1/board').then(r=>r.json());
    document.getElementById('meta').textContent =
      `审核模式 ${d.moderation==='auto'?'全自动':'需家长确认'} · 理解引擎 ${d.understanding==='llm'?'大模型':'规则'} · 共 ${d.stats.total} 条`;
    document.getElementById('stats').innerHTML = `
      <div class="stat"><b>${d.stats.today_delivered}</b><span>今日已发</span></div>
      <div class="stat"><b>${d.stats.total}</b><span>累计消息</span></div>`;
    const list = document.getElementById('list');
    list.innerHTML = '';
    if(!d.items.length){
      list.innerHTML = '<div class="empty">还没有消息。让孩子在手表上问个问题试试 👀</div>';
      return;
    }
    d.items.forEach(i => list.appendChild(card(i)));
  }catch(e){
    document.getElementById('meta').textContent = '加载失败：'+e;
  }
}
window.act = act;
load();
setInterval(load, 4000);
</script>
</body>
</html>
